name: check

on:
  push:
  pull_request:

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Default order is green
        run: mvn -B test
      - name: 300 random orders match expected.txt
        run: ./run.sh
